<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ea580c" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Background Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="6" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#amber)" stroke-width="4" stroke-dasharray="12 8" opacity="0.4" />

  <!-- Center Pin Base -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Shield / Location Pin Shape -->
    <path d="M 0 -130 C -75 -130 -135 -70 -135 5 C -135 90 -20 155 0 185 C 20 155 135 90 135 5 C 135 -70 75 -130 0 -130 Z" fill="url(#amber)" />
    <!-- Pin Core -->
    <circle cx="0" cy="-20" r="60" fill="#0f172a" />
    <!-- Wrench Tool inside Pin Core -->
    <path d="M -15 -35 L 5 -15 C 12 -22 24 -22 31 -15 C 38 -8 38 4 31 11 L 11 31 C 4 38 -8 38 -15 31 C -22 24 -22 12 -15 5 L 5 -15 Z" fill="#f59e0b" />
    <path d="M -22 15 L -35 28 L -25 38 L -12 25 Z" fill="#ffffff" />
  </g>
</svg>
